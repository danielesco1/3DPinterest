<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomboard viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; }
  #status { position: fixed; left: 12px; bottom: 12px; color: #ddd; font: 13px system-ui, sans-serif; background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 6px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="status">Loading model…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// ?room=hiroto-space picks which room folder to load from the bucket.
const BUCKET = "https://storage.googleapis.com/roomboard-demo-rooms/rooms/";
const room = new URLSearchParams(location.search).get("room") || "hiroto-space";
const status = document.getElementById("status");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0.17, 1.5, 1.6); // inside the room, near the entry side

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.17, 1.37, 0.06); // room-center anchor
controls.enableDamping = true;
controls.update();

const spark = new SparkRenderer({ renderer });
scene.add(spark);

// The scan's room-source.json is y-up (floor 0, ceiling about 2.73), matching three.js, so no flip by default.
// Add ?flip=1 to the URL to try the 180° X flip from Spark's example if the room renders upside down.
const splat = new SplatMesh({ url: BUCKET + room + "/splat.spz" });
if (new URLSearchParams(location.search).get("flip") === "1") splat.quaternion.set(1, 0, 0, 0);
scene.add(splat);

splat.addEventListener?.("load", () => { status.textContent = "Model loaded. Click a keyword in the room page to fly to it."; });
setTimeout(() => { if (status.textContent === "Loading model…") status.textContent = "Still loading (the model is about 31 MB)…"; }, 8000);

// Fly the camera to a point (scene units) taken from tags.json anchors.
let fly = null;
function flyTo(position, duration = 1.2) {
  const target = new THREE.Vector3(...position);
  const offset = new THREE.Vector3(0, 0.4, 1.2);
  fly = {
    t0: performance.now(), duration,
    fromPos: camera.position.clone(), toPos: target.clone().add(offset),
    fromTarget: controls.target.clone(), toTarget: target.clone(),
  };
}

// The room page sends { type: "fly", position: [x, y, z] } when a keyword is clicked.
addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data || {};
  if (d.type === "fly" && Array.isArray(d.position) && d.position.length === 3) flyTo(d.position);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.t0) / (fly.duration * 1000));
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; // ease in-out
    camera.position.lerpVectors(fly.fromPos, fly.toPos, e);
    controls.target.lerpVectors(fly.fromTarget, fly.toTarget, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
