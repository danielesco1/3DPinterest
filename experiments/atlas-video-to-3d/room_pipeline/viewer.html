<!doctype html><html><meta charset="utf-8"><title>Room reconstruction</title>
<style>body{margin:0;font:14px system-ui;background:#e5e5e5}#panel{position:absolute;z-index:2;left:16px;top:16px;max-width:360px;padding:16px;background:#fffffff0;border-radius:8px}label{display:inline-block;margin:8px}button{padding:8px}canvas{display:block}#status{max-width:340px}</style>
<div id="panel"><b id="title">Room reconstruction</b><p>Native-coordinate splat + estimated room outlines.<br>No alignment or scale transform applied.</p><label><input id="splat" type="checkbox" checked>Splat</label><label><input id="cad" type="checkbox" checked>CAD</label><label><input id="openings" type="checkbox" checked>Openings</label><button id="fit">Fit room</button><p id="scale"></p><p id="status">Loading…</p></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js","three/addons/postprocessing/Pass.js":"./vendor/Pass.js","@sparkjsdev/spark":"./vendor/spark.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {SparkRenderer,SplatMesh} from '@sparkjsdev/spark';
const $=id=>document.getElementById(id);
try {
const response=await fetch('./scene.json');if(!response.ok)throw Error('Scene metadata unavailable');const data=await response.json();
$('title').textContent=data.take_id;$('scale').textContent='Scale: '+data.scale.status+'. Geometry is estimated, not surveyed.';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e5e5e5');const camera=new THREE.PerspectiveCamera(50,1,.01,10000);camera.up.set(...data.up);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new SparkRenderer({renderer}));
const model=new SplatMesh({url:data.spz,onLoad:()=>{$('status').textContent='SPZ loaded. Orange: room envelope; cyan: opening outlines.';}});scene.add(model);
function lines(segments,color){return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segments.flat().map(p=>new THREE.Vector3(...p))),new THREE.LineBasicMaterial({color,depthTest:false}));}
const room=lines(data.edges,0xd97912);room.renderOrder=10;scene.add(room);
const openingSegments=data.openings.flatMap(o=>o.corners.map((p,i)=>[p,o.corners[(i+1)%o.corners.length]]));
const openings=lines(openingSegments,0x007e96);openings.renderOrder=11;scene.add(openings);
const box=new THREE.Box3().setFromPoints(data.vertices.map(p=>new THREE.Vector3(...p))),center=box.getCenter(new THREE.Vector3()),radius=Math.max(box.getSize(new THREE.Vector3()).length(),.1);
function fit(){const direction=new THREE.Vector3(1,.7,1).normalize();if(Math.abs(direction.dot(camera.up))>.95)direction.set(1,0,0);controls.target.copy(center);camera.position.copy(center).addScaledVector(direction,radius*1.3);camera.near=radius/1000;camera.far=radius*1000;camera.updateProjectionMatrix();controls.update();}fit();
$('fit').onclick=fit;$('splat').onchange=e=>model.visible=e.target.checked;$('cad').onchange=e=>room.visible=e.target.checked;$('openings').onchange=e=>openings.visible=e.target.checked;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
model.initialized?.catch(()=>{$('status').textContent='SPZ failed to load. Check the packaged asset and browser WebGL support.';});
} catch(error){$('status').textContent='Viewer failed: '+error.message;}
</script></html>
